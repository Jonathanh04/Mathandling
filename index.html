<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veckans Tilbud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: hyllkant – en klistrig filterlist överst, sedan kategorier som hyllsektioner med prislappar i rutnät */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#15201b; --muted:#5d6b64; --line:#d9e0db;
  --accent:#1f6b4a; --accent-ink:#ffffff; --tag:#ffd83d; --tag-ink:#1b1a10; --save:#c0281d;
  --member:#6a3fb5; --chip:#e7ece8;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#17201b; --ink:#e6ede9; --muted:#9aaba2; --line:#2a3630;
  --accent:#5cc08f; --accent-ink:#0b1510; --tag:#f2c935; --tag-ink:#1b1a10; --save:#ff7a6b;
  --member:#b99bff; --chip:#1f2a24; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#17201b; --ink:#e6ede9; --muted:#9aaba2; --line:#2a3630;
  --accent:#5cc08f; --accent-ink:#0b1510; --tag:#f2c935; --tag-ink:#1b1a10; --save:#ff7a6b;
  --member:#b99bff; --chip:#1f2a24; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px 10px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em;margin:0;line-height:1}
.week{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.grow{flex:1 1 auto}
.search{flex:1 1 240px;min-width:0;display:flex}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.listbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.listbtn .n{font-family:var(--f-mono);background:var(--accent-ink);color:var(--accent);border-radius:99px;padding:0 7px;font-size:.8rem}

.row{display:flex;gap:6px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.chip .c{font-family:var(--f-mono);font-size:.72rem;opacity:.65}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:2px 12px;font-size:.85rem;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink);font-weight:600}
select{font:inherit;font-size:.85rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
label.tg{display:flex;align-items:center;gap:6px;cursor:pointer}

main{padding-block:18px 60px}
.sec{margin-bottom:34px}
.sec h2{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink);text-wrap:balance}
.sec h2 .c{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.more{margin-top:12px;border:1px dashed var(--line);background:none;border-radius:8px;padding:9px 14px;color:var(--accent);font-weight:600}

.card{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px}
.card .meta{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.store{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.store i{width:8px;height:8px;border-radius:2px;display:inline-block}
.card .da{font-size:.74rem;color:var(--muted);font-style:italic;margin-top:-5px;overflow-wrap:anywhere}
.card h3{font-family:var(--f-body);font-weight:600;font-size:.95rem;line-height:1.25;margin:0;overflow-wrap:anywhere}
.card p{margin:0;font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pricebox{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.tag{background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;padding:3px 8px 2px;border-radius:3px;font-size:1.15rem;line-height:1.2;font-variant-numeric:tabular-nums;clip-path:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px))}
.tag small{font-size:.7rem;font-weight:500}
.pre{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-decoration:line-through}
.unit{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.b{font-size:.68rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.b.save{color:var(--save)} .b.mem{color:var(--member)} .b.soon{color:var(--accent)} .b.lim{color:var(--muted)}
.add{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:5px 9px;font-size:.8rem;font-weight:600;white-space:nowrap}
.add[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:40px 0;color:var(--muted);text-align:center}

/* inköpslista */
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer h2{font-family:var(--f-display);margin:0;font-size:1.3rem}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.x{border:0;background:var(--chip);border-radius:8px;padding:6px 10px}
.note{font-size:.78rem;color:var(--muted);margin:0 0 12px}
.list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.lgroup h4{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.li.done .nm{text-decoration:line-through;color:var(--muted)}
.li .nm{min-width:0;overflow-wrap:anywhere}
.li .pr{font-family:var(--f-mono);font-size:.8rem}
.li .rm{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.ltot{border-top:2px solid var(--ink);padding-top:10px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-weight:600}
.dactions{display:flex;gap:8px;margin-top:10px}
.dactions button{flex:1;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
.tabs{display:flex;gap:4px;padding-block:0 10px}
.tab{border:0;background:none;padding:6px 2px;margin-right:14px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.rform{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:22px}
.rrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.rrow > label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.rrow input[type=text]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:min(420px,100%)}
.prefs{display:flex;flex-wrap:wrap;gap:6px}
.go{border:0;border-radius:8px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.go:disabled{opacity:.55;cursor:default}
.ghost{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:none;font-weight:600}
.rstatus{font-size:.85rem;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.recipe h3{font-family:var(--f-display);font-size:1.2rem;margin:0;text-wrap:balance}
.recipe .lead{margin:0;color:var(--muted);font-size:.88rem}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.rmeta b{color:var(--ink);font-weight:600}
.recipe h4{margin:4px 0 0;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.ing .amt{color:var(--muted)}
.ing .deal{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:.75rem;flex-wrap:wrap}
.ing .deal .tag{font-size:.78rem;padding:1px 6px}
.ing .home{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;align-self:center}
.steps{margin:0;padding-left:20px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.recipe .addall{align-self:flex-start}
.dishform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.dishform input[type=text]{font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.dhero{display:flex;flex-direction:column;gap:4px;margin:6px 0 14px}
.dhero h2{font-family:var(--f-display);font-size:1.6rem;margin:0}
.dhero p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile .v i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile .ghost{align-self:flex-start;font-size:.8rem;padding:6px 10px;margin-top:auto}
.ingtable{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(140px,1fr) 2fr 2fr;gap:12px;align-items:start}
@media (max-width:760px){.irow{grid-template-columns:1fr}}
.irow .iname{font-weight:600}
.irow .iamt{font-size:.8rem;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:.85rem}
.pick .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.pick .lbl.cheap{color:var(--accent)} .pick .lbl.qual{color:var(--member)}
.pick .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pick .pn{overflow-wrap:anywhere}
.pick .why{font-size:.78rem;color:var(--muted);font-style:italic}
.pick .alt{font-size:.75rem;color:var(--muted)}
.none{font-size:.82rem;color:var(--muted)}
.cover{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.cbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.cbar span{display:block;height:100%;border-radius:5px}
.crow .ct{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{color:var(--muted);font-size:.75rem;padding-block:0 30px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>Veckans Tilbud</h1>
        <div class="week" id="week">Köpenhamn · hämtar erbjudanden…</div>
      </div>
      <div class="search"><input id="q" type="search" placeholder="Sök på svenska eller danska, t.ex. kaffe, lax, toalettpapper" aria-label="Sök erbjudanden"></div>
      <button class="listbtn" id="openList" type="button">Inköpslista <span class="n" id="listN">0</span></button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" id="tab-deals" aria-selected="true">Erbjudanden</button>
      <button class="tab" type="button" role="tab" id="tab-recipes" aria-selected="false">Recept</button>
      <button class="tab" type="button" role="tab" id="tab-dish" aria-selected="false">Var ska jag handla?</button>
    </div>
    <div id="dealFilters">
    <div class="row" id="stores" aria-label="Butiker"></div>
    <div class="row" id="cats" aria-label="Kategorier"></div>
    <div class="controls">
      <div class="seg" id="when" role="group" aria-label="Giltighet">
        <button type="button" data-v="all" aria-pressed="true">Alla</button>
        <button type="button" data-v="now" aria-pressed="false">Gäller nu</button>
        <button type="button" data-v="soon" aria-pressed="false">Kommande</button>
      </div>
      <label for="sort">Sortera
        <select id="sort">
          <option value="save">Störst rabatt</option>
          <option value="unit">Lägst jämförpris</option>
          <option value="price">Lägst pris</option>
          <option value="name">Namn A–Ö</option>
        </select>
      </label>
      <label class="tg" for="nonfood"><input type="checkbox" id="nonfood"> Visa non-food</label>
      <label class="tg" for="nomember"><input type="checkbox" id="nomember"> Dölj medlemspriser</label>
    </div>
    </div>
  </div>
</header>

<section class="wrap" id="recipes" hidden style="padding-block:18px 60px">
  <form class="rform" id="rform">
    <div class="rrow">
      <label for="rstore">Butik<select id="rstore"></select></label>
      <label for="rcount">Antal recept<select id="rcount"><option>3</option><option selected>4</option><option>6</option></select></label>
      <label for="rserv">Portioner<select id="rserv"><option>1</option><option selected>2</option><option>4</option><option>6</option></select></label>
    </div>
    <div class="prefs" id="rprefs" aria-label="Önskemål">
      <button class="chip" type="button" data-p="Vegetariskt" aria-pressed="false">Vegetariskt</button>
      <button class="chip" type="button" data-p="Snabbt, högst 30 minuter" aria-pressed="false">Snabbt (≤ 30 min)</button>
      <button class="chip" type="button" data-p="Barnvänligt" aria-pressed="false">Barnvänligt</button>
      <button class="chip" type="button" data-p="Så billigt som möjligt" aria-pressed="false">Billigt</button>
      <button class="chip" type="button" data-p="Passar som matlåda" aria-pressed="false">Matlåda</button>
      <button class="chip" type="button" data-p="Proteinrikt" aria-pressed="false">Proteinrikt</button>
      <button class="chip" type="button" data-p="Helgmiddag, får ta tid" aria-pressed="false">Helgmiddag</button>
    </div>
    <div class="rrow">
      <label for="rwish" style="flex:1 1 280px">Egna önskemål (valfritt)<input type="text" id="rwish" placeholder="t.ex. något med kyckling, ingen koriander, asiatiskt"></label>
    </div>
    <div class="rrow">
      <button class="go" type="submit" id="rgo">Generera recept</button>
      <button class="ghost" type="button" id="rstop" hidden>Stoppa</button>
      <span class="rstatus" id="rstatus"></span>
    </div>
  </form>
  <div class="rgrid" id="rout"></div>
</section>

<section class="wrap" id="dish" hidden style="padding-block:18px 60px">
  <form class="rform" id="dform">
    <div class="dishform">
      <label for="dname" class="tk" style="display:flex;flex-direction:column;gap:4px;flex:1 1 260px;font-size:.78rem;color:var(--muted);font-weight:600">Vad vill du äta?
        <input type="text" id="dname" placeholder="t.ex. Tuna melt, Lasagne, Pad thai" maxlength="120" required></label>
      <label for="dserv" style="display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600">Portioner<select id="dserv"><option>1</option><option selected>2</option><option>4</option><option>6</option></select></label>
      <button class="go" type="submit" id="dgo">Hitta bästa butiken</button>
      <button class="ghost" type="button" id="dstop" hidden>Stoppa</button>
    </div>
    <span class="rstatus" id="dstatus">Skriv en maträtt så jämför jag ingredienserna mot veckans erbjudanden i alla sju butikerna.</span>
  </form>
  <div id="dout"></div>
</section>

<main class="wrap" id="main"><div class="empty">Laddar veckans erbjudanden…</div></main>
<footer class="wrap" id="foot"></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Inköpslista">
  <div class="dhead"><h2>Inköpslista</h2><button class="x" id="closeList" type="button">Stäng</button></div>
  <p class="note" id="syncNote">Listan sparas i den här webbläsaren.</p>
  <div class="list" id="list"></div>
  <div class="ltot" id="ltot" hidden></div>
  <div class="dactions">
    <button type="button" id="clearDone">Ta bort avbockade</button>
    <button type="button" id="copyList">Kopiera lista</button>
  </div>
</aside>

<script>
const CATS = [
  ["kott","Kött & fågel"],["chark","Chark & pålägg"],["fisk","Fisk & skaldjur"],
  ["frukt","Frukt & bär"],["gront","Grönsaker"],["mejeri","Mejeri & ägg"],["ost","Ost"],
  ["brod","Bröd & bageri"],["fryst","Fryst"],["fardig","Färdigmat & vego"],
  ["torr","Torrvaror & skafferi"],["dryck","Drycker"],["godis","Godis & snacks"],
  ["hushall","Hem & hushåll"],["hygien","Hygien & hälsa"],["djur","Djurmat"],["ovrigt","Övrigt (non-food)"]
];
const CATNAME = Object.fromEntries(CATS);
const PER_SECTION = 12;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kr = n => n == null ? "" : (Math.round(n*100)/100).toLocaleString("da-DK",{minimumFractionDigits: n%1 ? 2 : 0, maximumFractionDigits:2});
const DAYS = ["sön","mån","tis","ons","tor","fre","lör"];
const dshort = d => `${DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;

const store = { get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:JSON.parse(v);}catch{return f} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch{} } };

let DATA = null, OFFERS = [];
const st = Object.assign({ stores:null, cat:"all", when:"all", sort:"save", q:"", nonfood:false, nomember:false }, store.get("tilbud.ui", {}));
st.q = "";
const expanded = new Set();

/* ---------- inköpslista: delad via db om möjligt, annars lokalt ---------- */
let LIST = {};            // offerId -> item
let dbList = null;        // CollectionReference
function renderListCount(){ $("#listN").textContent = Object.values(LIST).filter(i=>!i.done).length; }
async function initList(){
  LIST = store.get("tilbud.list", {});
  renderListCount();
  const db = await (window.claude?.use?.("db") ?? null);

function saveUi(){ const {q, ...rest} = st; store.set("tilbud.ui", rest); }
function status(o, now){ const f = new Date(o.f), t = new Date(o.t); return f > now ? "soon" : (t >= now ? "now" : "old"); }
function discount(o){ return o.pp && o.pp > o.p ? (o.pp - o.p) / o.pp : 0; }

function filtered(ignoreCat){
  const now = new Date(), q = st.q.trim().toLowerCase();
  return OFFERS.filter(o => {
    if (!st.stores.includes(o.s)) return false;
    const s = status(o, now); if (s === "old") return false;
    if (st.when !== "all" && s !== st.when) return false;
    if (!st.nonfood && o.c === "ovrigt" && st.cat !== "ovrigt") return false;
    if (st.nomember && o.m) return false;
    if (!ignoreCat && st.cat !== "all" && o.c !== st.cat) return false;
    if (q && !(o.n.toLowerCase().includes(q) || (o.sv||"").toLowerCase().includes(q) || o.d.toLowerCase().includes(q))) return false;
    return true;
  });
}
function sorter(a,b){
  switch(st.sort){
    case "unit": return (a.uu===b.uu ? 0 : (a.uu||"z").localeCompare(b.uu||"z")) || (a.up??1e9)-(b.up??1e9);
    case "price": return (a.p??1e9)-(b.p??1e9);
    case "name": return (a.sv||a.n).localeCompare(b.sv||b.n,"sv");
    default: return discount(b)-discount(a) || (a.up??1e9)-(b.up??1e9);
  }
}
function card(o, now){

const byIdAll = () => Object.fromEntries(OFFERS.map(o => [o.id, o]));
// jämför på jämförpris när båda har samma enhet, annars på styckpris
function cheaper(a, b){ return (a.up && b.up && a.uu === b.uu) ? a.up - b.up : (a.p ?? 1e9) - (b.p ?? 1e9); }
function dishPrompt(dish, serv, offers){
  const lines = offers.map(o => `${o.id}|${DATA.stores[o.s].name}|${o.sv || o.n}|${o.n}|${kr(o.p)} kr${o.up ? ` (${kr(o.up)} kr/${o.uu})` : ""}|${(o.d||"").slice(0,80)}`).join("\n");
  return `Användaren vill laga maträtten ${JSON.stringify(dish)} för ${serv} portioner och vill veta i vilken butik i Köpenhamn ingredienserna är billigast eller håller bäst kvalitet idag. Listan nedan innehåller bara erbjudanden som gäller idag; använd inga andra.

Gör så här:
1. Lista ingredienserna en vanlig version av rätten behöver (svenska namn, metriska mängder för ${serv} portioner). Markera basvaror de flesta har hemma (salt, peppar, olja, kryddor) med "pantry": true.
2. För varje ingrediens: ange ALLA offer_id i listan nedan som rimligen kan användas som den ingrediensen, oavsett butik ("matches"). Var noggrann: tonfisk på burk matchar inte färsk tonfiskbiff; riven ost matchar ost till gratinering men inte färskost. Hittar du inget, ge en tom lista.
3. Välj bland matcherna det bästa kvalitetsalternativet ("quality"), utifrån t.ex. ekologiskt, premiummärke, högre köttandel, MSC, lagrad ost eller färskhet. Ge en kort motivering på svenska. Om bara ett lågprisalternativ finns, sätt quality till null.
4. Ge en kort mening ("summary") om rätten och vad som är viktigast att handla bra.

Svara ENDAST med JSON i exakt denna form:
{"dish":"Tuna melt","servings":${serv},"summary":"...","ingredients":[{"name":"tonfisk i vatten","amount":"2 burkar (à 185 g)","pantry":false,"matches":["ID1","ID2"],"quality":{"offer_id":"ID2","why":"MSC-märkt, hela bitar i olivolja"}}]}

Erbjudanden som gäller idag (offer_id|butik|svenskt namn|danskt namn|pris|detaljer):
${lines}`;
}
function renderDish(data){
  const out = $("#dout"), byId = byIdAll(), now = new Date();
  const ings = (Array.isArray(data?.ingredients) ? data.ingredients : []).map(i => {
    // Endast kampanjvaror som gäller idag, aldrig kommande eller utgångna
    const m = (Array.isArray(i.matches) ? i.matches : []).map(id => byId[id]).filter(o => o && status(o, now) === "now").sort(cheaper);
    const qo = i.quality?.offer_id ? byId[i.quality.offer_id] : null;
    const q = qo && status(qo, now) === "now" ? qo : null;
    return { name: String(i.name || ""), amount: String(i.amount || ""), pantry: !!i.pantry, m, q, why: i.quality?.why || "" };
  });
  const need = ings.filter(i => !i.pantry && i.m.length);
  // per butik: billigaste matchning per ingrediens
  const per = Object.keys(DATA.stores).map(sid => {
    const picks = need.map(i => i.m.find(o => o.s === sid)).filter(Boolean);
    return { sid, n: picks.length, sum: picks.reduce((a,o)=>a+(o.p||0),0), picks };
  }).sort((a,b) => b.n - a.n || a.sum - b.sum);
  const one = per[0];
  const split = need.map(i => i.m[0]);
  const splitSum = split.reduce((a,o)=>a+(o.p||0),0);
  const splitStores = [...new Set(split.map(o => o.s))];
  const qual = need.map(i => i.q).filter(Boolean);
  const qc = {}; qual.forEach(o => qc[o.s] = (qc[o.s]||0)+1);
  const qbest = Object.entries(qc).sort((a,b)=>b[1]-a[1])[0];
  const chip = sid => `<i style="background:${DATA.stores[sid].color}"></i>${esc(DATA.stores[sid].name)}`;
  const offerLine = o => `<div class="line"><span class="store">${chip(o.s)}</span><span class="tag">${kr(o.p)}<small> kr</small></span>${o.up ? `<span class="unit">${kr(o.up)} kr/${o.uu}</span>` : ""}<button class="add" type="button" data-id="${esc(o.id)}" aria-pressed="${!!LIST[o.id]}">${LIST[o.id] ? "✓ På listan" : "+ Lista"}</button></div>
      <div class="pn">${esc(o.sv || o.n)} <span class="alt">t.o.m. ${dshort(new Date(o.t))}</span>${o.m ? ` <span class="b mem">Medlemspris</span>` : ""}</div>`;
  const max = Math.max(1, ...per.map(p => p.n));
  out._sets = { one: one?.picks.map(o=>o.id) || [], split: split.map(o=>o.id), qual: qual.map(o=>o.id) };
  out.innerHTML = `
    <div class="dhero"><h2>${esc(data.dish || "")}</h2>${data.summary ? `<p>${esc(data.summary)}</p>` : ""}
      <p style="font-size:.82rem">${need.length} av ${ings.filter(i=>!i.pantry).length} ingredienser finns på kampanj idag (${dshort(now)}). Bara erbjudanden som gäller idag är med.</p></div>
    ${need.length ? `<div class="tiles">
      <div class="tile"><span class="k">Allt i en butik</span><span class="v">${chip(one.sid)}</span>
        <span class="s">${one.n} av ${need.length} kampanjvaror · ${kr(one.sum)} kr</span>
        <button class="ghost" type="button" data-set="one">Lägg i listan</button></div>
      <div class="tile"><span class="k">Billigast om du delar upp</span><span class="v">${kr(splitSum)} kr</span>
        <span class="s">${splitStores.map(s => DATA.stores[s].name).join(" + ")}${splitStores.length > 1 && one.n === need.length ? ` · sparar ${kr(one.sum - splitSum)} kr mot en butik` : ""}</span>
        <button class="ghost" type="button" data-set="split">Lägg i listan</button></div>
      <div class="tile"><span class="k">Bäst kvalitet</span><span class="v">${qbest ? chip(qbest[0]) : "–"}</span>
        <span class="s">${qbest ? `${qbest[1]} av ${qual.length} kvalitetsval · ${kr(qual.reduce((a,o)=>a+(o.p||0),0))} kr totalt` : "Inga tydliga kvalitetsalternativ den här veckan"}</span>
        ${qual.length ? `<button class="ghost" type="button" data-set="qual">Lägg i listan</button>` : ""}</div>
    </div>
    <h3 class="tk" style="font-family:var(--f-display);margin:0 0 8px">Så många ingredienser finns i varje butik</h3>
    <div class="cover">${per.map(p => `<div class="crow"><span class="store">${chip(p.sid)}</span><span class="cbar"><span style="width:${p.n/max*100}%;background:${DATA.stores[p.sid].color}"></span></span><span class="ct">${p.n}/${need.length} · ${kr(p.sum)} kr</span></div>`).join("")}</div>` : ""}
    <h3 style="font-family:var(--f-display);margin:18px 0 8px">Ingredienser</h3>
    <div class="ingtable">${ings.map(i => `<div class="irow">
      <div><div class="iname">${esc(i.name)}</div><div class="iamt">${esc(i.amount)}</div></div>
      ${i.pantry ? `<div class="none" style="grid-column:2/-1">Basvara, finns oftast hemma.</div>` :
        !i.m.length ? `<div class="none" style="grid-column:2/-1">Inte på kampanj någonstans idag. Köp där du ändå handlar.</div>` : `
      <div class="pick"><span class="lbl cheap">Billigast</span>${offerLine(i.m[0])}${i.m.length > 1 ? `<span class="alt">Även i: ${[...new Set(i.m.slice(1).map(o => DATA.stores[o.s].name))].join(", ")}</span>` : ""}</div>
      <div class="pick"><span class="lbl qual">Bäst kvalitet</span>${i.q ? offerLine(i.q) + (i.why ? `<span class="why">${esc(i.why)}</span>` : "") : `<span class="none">Inget tydligt kvalitetsalternativ. Det billigaste duger.</span>`}</div>`}
    </div>`).join("")}</div>
    <p class="rstatus">Kvalitetsvalen är Claudes bedömning utifrån märke och produktbeskrivning. Priserna är kampanjpriser och förpackningsstorlekarna kan skilja sig åt.</p>`;
}
$("#dout").addEventListener("click", e => {
  const a = e.target.closest(".add"); if (a){ const o = OFFERS.find(x=>x.id===a.dataset.id); if (o) toggleItem(o); return; }
  const b = e.target.closest("[data-set]");
  if (b){ ($("#dout")._sets?.[b.dataset.set] || []).forEach(id => { if (!LIST[id]) { const o = OFFERS.find(x=>x.id===id); if (o) toggleItem(o); } }); b.textContent = "Tillagt i listan"; }
});
$("#dstop").onclick = () => dctl?.abort();
$("#dform").addEventListener("submit", async e => {
  e.preventDefault();
  const dish = $("#dname").value.trim();
  if (!sampleFn || !DATA || !dish) return;
  const now = new Date(), offers = OFFERS.filter(o => DISH_CATS.has(o.c) && status(o, now) === "now");
  dctl = new AbortController();
  $("#dgo").disabled = true; $("#dstop").hidden = false;
  $("#dstatus").textContent = `Letar efter ingredienserna till ${dish} bland ${offers.length} erbjudanden som gäller idag… (brukar ta 30–90 sekunder)`;
  try {
    const data = await sampleFn.json(dishPrompt(dish, $("#dserv").value, offers), { signal: dctl.signal, cache: false, onText: () => { $("#dstatus").textContent = "Jämför butikerna…"; } });
    if (!Array.isArray(data?.ingredients) || !data.ingredients.length) throw {code:"invalid_json"};
    lastDish = { dish, data, at: Date.now() }; store.set("tilbud.dish", lastDish);
    renderDish(data);
    $("#dstatus").textContent = `Klart. Skriv en ny maträtt för att jämföra igen.`;
  } catch (err) {
    const c = err?.code;
    $("#dstatus").textContent =
      c === "cancelled" ? "Stoppat." :
      c === "not_granted" || c === "sampling_disabled" || c === "not_declared" ? "Funktionen kräver att du tillåter appen att använda Claude. Ladda om sidan och välj Tillåt." :
      c === "rate_limited" ? "För många förfrågningar just nu. Vänta en stund och försök igen." :
      c === "invalid_json" ? "Svaret gick inte att läsa. Försök igen." :
      "Något gick fel med anslutningen. Försök igen.";
    if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared") sampleFn = null;
  } finally {
    $("#dgo").disabled = !sampleFn; $("#dstop").hidden = true;
  }
});

initList();
initRecipes();
boot().then(() => DATA && bootRecipes());
</script>
